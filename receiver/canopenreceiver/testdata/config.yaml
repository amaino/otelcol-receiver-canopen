interface: can0
read_timeout: 1s
metrics:
  enabled: true
  flush_interval: 10s
logs:
  enabled: true
heartbeat:
  logs: true
emcy:
  metrics: true
  logs: true
sdo:
  sniff:
    channels:
      - node_id: 1
        client_to_server_cob_id: 0x601
        server_to_client_cob_id: 0x581
      - node_id: 1
        client_to_server_cob_id: 0x611
        server_to_client_cob_id: 0x591
    objects:
     - node_id: 30
       index: 0x20F0
       sub_index: 0x11
       fields:
         - name: canopen.mcu.firmware
           type: uint32
           metrics: true
pdo:
  - name: motor_tpdo1
    cob_id: 0x181
    fields:
      - name: canopen.motor.speed
        bit_offset: 0
        type: int16
        scale: 0.1
        unit: rpm
        metrics: true
        metric_type: gauge
        attributes:
          axis: x
          priority: 200

