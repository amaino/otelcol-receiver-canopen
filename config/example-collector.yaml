receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  canopen:
    interface: vcan0
    read_timeout: 1s
    metrics:
      enabled: true
      flush_interval: 10s
    logs:
      enabled: true
    heartbeat:
      metrics: true
      logs: true
    emcy:
      metrics: true
      logs: true
    sdo:
      sniff:
        channels:
          - node_id: 1
            client_to_server_cob_id: 0x601
            server_to_client_cob_id: 0x581
        objects:
          - node_id: 1
            index: 0x20F0
            sub_index: 0x11
            fields:
              - name: canopen.mcu.firmware
                type: uint32
                metrics: true
                logs: true
                metric_type: gauge
                attributes:
                  source: sdo
    pdo:
      - name: motor_tpdo1
        cob_id: 0x181
        fields:
          - name: canopen.motor.speed
            bit_offset: 0
            type: int16
            scale: 0.1
            offset: 0
            unit: rpm
            metrics: true
            logs: true
            metric_type: gauge
            attributes:
              axis: x

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    timeout: 5s

exporters:
  debug:
    verbosity: detailed
  otlp:
    endpoint: ${env:OTLP_EXPORTER_ENDPOINT:-localhost:4317}
    tls:
      insecure: true

extensions:
  zpages:
    endpoint: 0.0.0.0:55679

service:
  extensions: [zpages]
  pipelines:
    metrics:
      receivers: [otlp, canopen]
      processors: [memory_limiter, batch]
      exporters: [debug, otlp]
    logs:
      receivers: [otlp, canopen]
      processors: [memory_limiter, batch]
      exporters: [debug, otlp]
