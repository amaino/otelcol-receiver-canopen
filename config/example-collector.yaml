receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  canopen:
    interface: vcan0
    sniff:
      enabled: true
      heartbeat:
        emit: logs
      emcy:
        emit: both
      sdo:
        emit: both
        filters:
          - node_id: 1
            index: 0x2001
            sub_index: 0x00
      pdos:
        - name: motor_tpdo1
          cob_id: 0x181
          signals:
            - name: canopen.motor.speed
              bit_offset: 0
              type: int16
              scale: 0.1
              unit: rpm
              emit: metrics

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    timeout: 5s

exporters:
  debug:
    verbosity: detailed
  otlp:
    endpoint: ${env:OTLP_EXPORTER_ENDPOINT:-localhost:4317}
    tls:
      insecure: true

extensions:
  zpages:
    endpoint: 0.0.0.0:55679

service:
  extensions: [zpages]
  pipelines:
    metrics:
      receivers: [otlp, canopen]
      processors: [memory_limiter, batch]
      exporters: [debug, otlp]
    logs:
      receivers: [otlp, canopen]
      processors: [memory_limiter, batch]
      exporters: [debug, otlp]
